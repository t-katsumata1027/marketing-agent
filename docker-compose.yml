services:
  preflight:
    build: .
    command: python scripts/verify_environment.py
    env_file: .env
    profiles: [production]
    restart: "no"

  agent-loop:
    build: .
    command: python -m src.agent_loop
    env_file: .env
    profiles: [production]
    restart: unless-stopped
    init: true
    depends_on:
      preflight:
        condition: service_completed_successfully
    volumes:
      - media-data:/var/lib/jarvis/media
      - heartbeat-agent:/var/lib/jarvis/heartbeat
    healthcheck:
      test: ["CMD", "python", "-c", "from src.heartbeat import is_heartbeat_fresh; raise SystemExit(not is_heartbeat_fresh('agent-loop', 120))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: { driver: local, options: { max-size: "10m", max-file: "5" } }

  publisher:
    build: .
    command: python -m src.publisher
    env_file: .env
    profiles: [production]
    restart: unless-stopped
    init: true
    depends_on:
      preflight:
        condition: service_completed_successfully
    volumes:
      - media-data:/var/lib/jarvis/media
      - heartbeat-publisher:/var/lib/jarvis/heartbeat
    healthcheck:
      test: ["CMD", "python", "-c", "from src.heartbeat import is_heartbeat_fresh; raise SystemExit(not is_heartbeat_fresh('publisher', 120))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: { driver: local, options: { max-size: "10m", max-file: "5" } }

  discord-bot:
    build: .
    command: python -m src.discord_bot
    env_file: .env
    profiles: [production]
    restart: unless-stopped
    init: true
    depends_on:
      preflight:
        condition: service_completed_successfully
    volumes:
      - heartbeat-discord:/var/lib/jarvis/heartbeat
    healthcheck:
      test: ["CMD", "python", "-c", "from src.heartbeat import is_heartbeat_fresh; raise SystemExit(not is_heartbeat_fresh('discord-bot', 120))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: { driver: local, options: { max-size: "10m", max-file: "5" } }

volumes:
  media-data:
  heartbeat-agent:
  heartbeat-publisher:
  heartbeat-discord:
